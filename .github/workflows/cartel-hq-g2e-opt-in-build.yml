# CARTEL HQ — G2E PR12 draft-only, opt-in verification.
# This file alone CANNOT start a runner: no pull_request, workflow_dispatch,
# schedule, or normal code push trigger.
# Run only after explicit free-minute/billing approval by pushing a DIFFERENT
# exact signal path (.github/g2e-build-run.once) to this preparation branch.
# This workflow is intentionally on a nonproduction branch and checks out
# the frozen PR12 commit; no merge, deploy, provider access or secrets.
name: Cartel HQ G2E opt-in build (AI OFF)

on:
  push:
    branches:
      - feature/g2e-build-check-prep-20261014
    paths:
      - .github/g2e-build-run.once

permissions:
  contents: read

concurrency:
  group: cartel-guide-g2e-one-build
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/feature/g2e-build-check-prep-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed Cartel HQ PR12 code
        uses: actions/checkout@v4
        with:
          ref: af8e72bc873a8779b7ea93ee06d2f5f71dcc4e4a
          persist-credentials: false
      - name: Confirm source pin
        run: test "$(git rev-parse HEAD)" = "af8e72bc873a8779b7ea93ee06d2f5f71dcc4e4a"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Full existing application build
        run: bun run build
      - name: TypeScript project validation
        run: ./node_modules/.bin/tsc --noEmit
      - name: Cartel HQ Guide offline regression
        run: node scripts/cartel-guide-g2e-offline-regression.mjs
