name: "Cartel HQ S2 draft checks"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sticker-s2-draft-qa.yml"
      - "scripts/sticker-s2-magick-wasm-smoke.ts"
      - "scripts/sticker-s2-real-component-browser-qa.mjs"
      - "scripts/sticker-s2-pack-route-browser-qa.mjs"
      - "scripts/sticker-s2-stage-client-build-preflight.mjs"
      - "scripts/sticker-pack-private-thumbnails-s2-regression.ts"
      - "scripts/sticker-s2-backfill-plan-regression.ts"
      - "src/lib/sticker-thumbnails.ts"
      - "src/lib/sticker-s2-backfill-plan.ts"
      - "src/lib/sticker-packs.ts"
      - "src/routes/_authenticated/sticker-lab.$packId.tsx"
      - "backend-source/edge-functions/sticker-ai/index.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sticker-s2-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s2-qa:
    # Only the owner's isolated PR #8 branch; no PCART or deploy workflows.
    if: github.head_ref == 'feature/sticker-pack-private-thumbnails-s2-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DENO_NO_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify real magick-wasm WebP encode/decode with synthetic fixture
        run: deno run --node-modules-dir=auto --allow-read --allow-net=registry.npmjs.org scripts/sticker-s2-magick-wasm-smoke.ts

      - name: Typecheck staged sticker-ai backend (report existing baseline debt)
        # Existing main has three known shared typing issues in the old Edge
        # source. Keep this diagnostic visible without masking app build QA.
        continue-on-error: true
        run: deno check --node-modules-dir=auto backend-source/edge-functions/sticker-ai/index.ts

      - name: Prepare Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked app dependencies
        run: bun install --frozen-lockfile

      - name: Execute S2 source and pure regression tests
        run: bun run scripts/sticker-pack-private-thumbnails-s2-regression.ts

      - name: Validate bounded legacy conversion plan with synthetic inventory
        run: bun run scripts/sticker-s2-backfill-plan-regression.ts

      - name: Prepare Node 22 for isolated browser QA
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install headless browser driver in temporary directory only
        run: npm install --prefix /tmp/cartel-s2-playwright --no-save --package-lock=false playwright@1.55.1

      - name: Browser QA of the real published-pack thumbnail component (synthetic, loopback only)
        run: node scripts/sticker-s2-real-component-browser-qa.mjs

      - name: Browser QA actual Sticker Lab pack route with synthetic data
        run: node scripts/sticker-s2-pack-route-browser-qa.mjs

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Build app (no deployment)
        run: bun run build
      - name: Build S2 against staging in ephemeral CI checkout, verify NO production Supabase URLs
        env:
          S2_STAGING_PUBLISHABLE_KEY: "sb_publishable_d-5F8v3yLIho-PLEelR4Pw_0HMfnuhO"
        run: node scripts/sticker-s2-stage-client-build-preflight.mjs
